name: Build Android APK

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        id: build
        run: |
          chmod +x gradlew
          set +e
          ./gradlew assembleDebug --console=plain 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          exit $code

      - name: Summarise build errors
        if: failure()
        run: |
          python3 - <<'PY'
          import re
          lines = [l.strip() for l in open('build.log', errors='replace')
                   if l.startswith('e: ') or 'error:' in l or 'What went wrong' in l or l.startswith('> ') or 'FAILED' in l]
          seen = []
          for l in lines:
              l = re.sub(r'file:///home/runner/work/[^/]+/[^/]+/android/app/src/main/java/np/edu/ganeshman/sms/', '', l)
              if l not in seen: seen.append(l)
          for i in range(0, min(len(seen), 150), 15):
              chunk = '%0A'.join(x.replace('%', '%25') for x in seen[i:i+15])
              print('::error title=build errors %d::%s' % (i // 15 + 1, chunk))
          PY

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk GaneshmanSchool.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GaneshmanSchool-apk
          path: android/GaneshmanSchool.apk

      - name: Publish to "latest" release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Latest Android APK
          body: Download **GaneshmanSchool.apk** below and install it on your phone.
          files: android/GaneshmanSchool.apk
          make_latest: true
